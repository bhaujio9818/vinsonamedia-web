<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GST & Profit Margin Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">GST & Profit Margin Calculator</h1>
      <p class="text-sm text-slate-500 mt-1">Product cost, margin aur GST ke sath accurate selling price calculate karein.</p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Cost Price (₹)</label>
        <input type="number" id="costPrice" placeholder="e.g. 500" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-medium" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Profit Margin (%)</label>
          <input type="number" id="profitMargin" placeholder="e.g. 25" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-medium" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">GST Rate (%)</label>
          <select id="gstRate" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-medium bg-white">
            <option value="0">0% (Nil)</option>
            <option value="5">5%</option>
            <option value="12">12%</option>
            <option value="18" selected>18%</option>
            <option value="28">28%</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Results Box -->
    <div class="mt-8 pt-6 border-t border-slate-100 bg-slate-50 -mx-6 -mb-6 md:-mx-8 md:-mb-8 p-6 md:p-8 rounded-b-2xl">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
          <span class="text-xs text-slate-400 block font-medium">Net Profit</span>
          <span id="profitDisplay" class="text-lg font-bold text-emerald-600">₹0.00</span>
        </div>
        <div class="p-3 bg-white rounded-xl border border-slate-100 shadow-sm">
          <span class="text-xs text-slate-400 block font-medium">GST Amount</span>
          <span id="gstDisplay" class="text-lg font-bold text-indigo-600">₹0.00</span>
        </div>
      </div>

      <div class="p-4 bg-indigo-600 rounded-xl text-white shadow-md flex justify-between items-center">
        <div>
          <span class="text-xs text-indigo-200 block font-medium uppercase tracking-wider">Final Selling Price (MRP)</span>
          <span id="finalPriceDisplay" class="text-2xl font-extrabold">₹0.00</span>
        </div>
        <button onclick="copyPrice()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition font-medium">Copy MRP</button>
      </div>
    </div>
  </div>

  <script>
    const costInput = document.getElementById('costPrice');
    const marginInput = document.getElementById('profitMargin');
    const gstInput = document.getElementById('gstRate');

    const profitDisplay = document.getElementById('profitDisplay');
    const gstDisplay = document.getElementById('gstDisplay');
    const finalPriceDisplay = document.getElementById('finalPriceDisplay');

    function calculate() {
      const cost = parseFloat(costInput.value) || 0;
      const marginPercent = parseFloat(marginInput.value) || 0;
      const gstPercent = parseFloat(gstInput.value) || 0;

      const profitAmount = (cost * marginPercent) / 100;
      const priceBeforeTax = cost + profitAmount;
      const gstAmount = (priceBeforeTax * gstPercent) / 100;
      const finalPrice = priceBeforeTax + gstAmount;

      profitDisplay.textContent = '₹' + profitAmount.toFixed(2);
      gstDisplay.textContent = '₹' + gstAmount.toFixed(2);
      finalPriceDisplay.textContent = '₹' + finalPrice.toFixed(2);
    }

    [costInput, marginInput, gstInput].forEach(el => el.addEventListener('input', calculate));

    function copyPrice() {
      const text = finalPriceDisplay.textContent;
      navigator.clipboard.writeText(text);
    }
  </script>
</body>
</html>
